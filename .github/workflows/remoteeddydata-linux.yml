name: Remote Eddydata - Linux

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: "1.5.3"
    secrets: inherit

  build-linux:
    name: Build remoteeddydata deb
    needs: generate-bridge
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Install git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y git ca-certificates
          git --version

      - name: Checkout RustDesk 1.5.3
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/1.5.3
          submodules: recursive

      - name: Download Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Checkout logo
        uses: actions/checkout@v4
        with:
          repository: h2o-helder/rdgen-eddydata
          ref: master
          path: logo-src
          sparse-checkout: |
            logoeddy.png
          sparse-checkout-cone-mode: false

      - name: Install packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y \
            build-essential clang cmake curl gcc g++ \
            libayatana-appindicator3-dev libasound2-dev libclang-10-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
            libpam0g-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-10-dev \
            nasm ninja-build pkg-config python3 rpm unzip zip wget xz-utils \
            libssl-dev imagemagick
          dpkg -s libgstreamer1.0-dev llvm-10-dev libclang-10-dev zip >/dev/null
          echo "Pacotes instalados."

      - name: Write server and key into source
        env:
          EDDY_SERVER: ${{ secrets.EDDYDATA_RENDEZVOUS_SERVER }}
          EDDY_KEY: ${{ secrets.EDDYDATA_PUBLIC_KEY }}
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          server = os.environ.get("EDDY_SERVER", "").strip()
          key = os.environ.get("EDDY_KEY", "").strip()
          if not server or not key:
              raise SystemExit("Secret do servidor ou da chave está vazio.")
          cfg = Path("libs/hbb_common/src/config.rs")
          text = cfg.read_text(encoding="utf-8")
          old_key = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw="
          if "rs-ny.rustdesk.com" not in text or old_key not in text:
              raise SystemExit("Servidor ou chave padrão não encontrados em config.rs.")
          cfg.write_text(text.replace("rs-ny.rustdesk.com", server).replace(old_key, key), encoding="utf-8")
          common = Path("src/common.rs")
          c = common.read_text(encoding="utf-8")
          if "https://admin.rustdesk.com" not in c:
              raise SystemExit("URL da API não encontrada.")
          common.write_text(c.replace("https://admin.rustdesk.com", "https://" + server), encoding="utf-8")
          if "rs-ny.rustdesk.com" in cfg.read_text(encoding="utf-8"):
              raise SystemExit("A troca do servidor não ficou gravada.")
          print("Servidor gravado:", server)
          PY

      - name: Force QuickSupport layout
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path("flutter/lib/desktop/pages/desktop_home_page.dart")
          t = p.read_text(encoding="utf-8")
          n = t.count("bind.isIncomingOnly()")
          print("isIncomingOnly:", n)
          if n < 2 or "loadLogo()" not in t:
              raise SystemExit("Layout do QuickSupport não encontrado.")
          p.write_text(t.replace("bind.isIncomingOnly()", "true"), encoding="utf-8")
          PY

      - name: Install logo
        run: |
          test -f logo-src/logoeddy.png
          cp logo-src/logoeddy.png ./res/icon.png
          convert ./res/icon.png -resize 256x256 ./res/icon.png
          mkdir -p ./flutter/assets
          cp logo-src/logoeddy.png ./flutter/assets/logo.png
          cp logo-src/logoeddy.png ./flutter/assets/logo_light.png
          cp logo-src/logoeddy.png ./flutter/assets/logo_dark.png

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter
        run: |
          wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
          tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter --version

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          git -C /opt/vcpkg checkout ${{ env.VCPKG_COMMIT_ID }}
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          test -x /opt/vcpkg/vcpkg
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"
          echo "/opt/vcpkg" >> "$GITHUB_PATH"
          /opt/vcpkg/vcpkg version

      - name: Build deb
        run: |
          python3 ./build.py --flutter

      - name: Collect deb
        run: |
          f=$(find . -name '*.deb' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          test -n "$f"
          cp "$f" remoteeddydata-linux-x64.deb
          ls -lh remoteeddydata-linux-x64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remoteeddydata-linux
          path: remoteeddydata-linux-x64.deb
          if-no-files-found: error
          retention-days: 30
